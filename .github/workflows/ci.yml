name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # No external keys in CI: OpenAI and Booking.com fall back to mock data.
        env:
          OPENAI_API_KEY: ""
        run: pytest -q

  web:
    name: ${{ matrix.app }} (lint + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin-pannel]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the Dockerfiles
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Non-blocking for now: existing code has lint debt (e.g. `any` types).
        # Remove continue-on-error once `npm run lint` is clean.
        continue-on-error: true
        run: npm run lint

      - name: Build (includes type-check)
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build backend frontend admin

  deploy:
    name: Deploy to production
    # Only after every check above passes, and only for main (never PRs).
    needs: [backend, web, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://travelplannerbro.com
    # Never run two deploys at once; queue instead of cancelling mid-deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and restart on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            APP_DIR="$APP_DIR" SHA="$SHA" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          # Deploy exactly the commit that passed CI. Untracked files such as
          # .env are left alone; local edits to tracked files are discarded.
          git fetch --prune origin main
          git reset --hard "$SHA"
          docker compose up -d --build --remove-orphans
          docker image prune -f
          docker compose ps
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://travelplannerbro.com/health; then
              echo; echo "Healthy"; exit 0
            fi
            sleep 6
          done
          echo "Site did not become healthy after deploy" >&2
          exit 1
